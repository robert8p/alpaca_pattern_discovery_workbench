name: patch-exec-failure
on:
  push:
    branches: [executable-strategy-v27d]
    paths: ['.github/workflows/patch-exec-failure.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: executable-strategy-v27d
      - run: |
          python scripts/patch_exec_failure_tmp.py
          git config user.name 'Executable Strategy Research Builder'
          git config user.email 'executable-strategy@users.noreply.github.com'
          git add app/worker.py tests/test_executable_strategy.py
          git diff --cached --quiet || git commit -m 'Propagate executable strategy failure state'
          git push origin HEAD:executable-strategy-v27d
