name: release-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pdw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pdw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pdw_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pdw_test
      RUN_POSTGRES_INTEGRATION: "1"
      APP_PASSWORD: ci-password
      AUTO_MIGRATE: "true"
      DATABASE_STATEMENT_TIMEOUT_SECONDS: "120"
      FEATURE_BATCH_WALL_TIMEOUT_SECONDS: "150"
      DISCOVERY_STATEMENT_TIMEOUT_SECONDS: "60"
      DISCOVERY_WALL_TIMEOUT_SECONDS: "75"
      ROBUSTNESS_INITIAL_SYMBOL_SHARDS: "1"
      ROBUSTNESS_QUERY_RETRIES: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Python compile
        run: python -m compileall -q app scripts tests
      - name: JavaScript syntax
        run: node --check app/static/app.js && node --check app/static/phase1.js
      - name: Unit and PostgreSQL integration tests
        run: pytest -q
      - name: Release audit
        run: python scripts/release_audit.py
