name: patch-point-in-time-capacity
on:
  push:
    branches: [whole-strategy-economics-v1]
    paths: ['.github/workflows/patch-capacity.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whole-strategy-economics-v1
      - name: Patch capacity timing
        run: |
          python scripts/patch_capacity_tmp.py
          git config user.name 'Whole Strategy Research Builder'
          git config user.email 'whole-strategy-research@users.noreply.github.com'
          git add app/strategy_economics.py tests/test_strategy_economics.py
          git diff --cached --quiet || git commit -m 'Use point-in-time liquidity for strategy capacity'
          git push origin HEAD:whole-strategy-economics-v1
