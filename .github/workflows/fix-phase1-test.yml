name: fix-phase1-test
on:
  push:
    branches: [phase1-full-history-v2.5.0]
    paths: ['.github/workflows/fix-phase1-test.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-full-history-v2.5.0
      - name: Fix integration-test connection import scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_postgres_integration.py')
          s=p.read_text()
          old='from app.db import close_pool, execute_schema\n'
          new='from app.db import close_pool, connection, execute_schema\n'
          if old not in s:
              raise SystemExit('expected import not found')
          s=s.replace(old,new,1)
          s=s.replace('    from app.db import connection\n    with connection() as conn:\n','    with connection() as conn:\n',1)
          p.write_text(s)
          PY
          git config user.name 'Phase 1 Research Builder'
          git config user.email 'phase1-research-builder@users.noreply.github.com'
          git add tests/test_postgres_integration.py
          git commit -m 'Fix Phase 1 PostgreSQL integration test scope'
          git push origin HEAD:phase1-full-history-v2.5.0
