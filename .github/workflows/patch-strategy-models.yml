name: patch-strategy-integration
on:
  push:
    branches: [whole-strategy-economics-v1]
    paths: ['.github/workflows/patch-strategy-models.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whole-strategy-economics-v1
      - name: Patch integration
        run: |
          python scripts/patch_strategy_integration_tmp.py
          git config user.name 'Whole Strategy Research Builder'
          git config user.email 'whole-strategy-research@users.noreply.github.com'
          git add app/db.py app/main.py app/worker.py scripts/release_audit.py
          git diff --cached --quiet || git commit -m 'Integrate whole-strategy economics into app and worker'
          git push origin HEAD:whole-strategy-economics-v1
