name: patch-strategy-tests
on:
  push:
    branches: [whole-strategy-economics-v1]
    paths: ['.github/workflows/patch-strategy-models.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: whole-strategy-economics-v1
      - name: Patch strategy tests
        run: |
          python scripts/patch_strategy_tests_tmp.py
          git config user.name 'Whole Strategy Research Builder'
          git config user.email 'whole-strategy-research@users.noreply.github.com'
          git add tests/test_candidate_export.py tests/test_schema_startup.py tests/test_postgres_integration.py
          git diff --cached --quiet || git commit -m 'Update integration tests for whole-strategy economics'
          git push origin HEAD:whole-strategy-economics-v1
