name: apply-phase1

on:
  push:
    branches:
      - phase1-full-history-v2.5.0
    paths:
      - '.github/workflows/apply-phase1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-full-history-v2.5.0
          fetch-depth: 0
      - name: Reassemble and apply audited Phase 1 patch
        shell: bash
        run: |
          set +e
          mkdir -p .phase1
          : > .phase1/diagnostic.txt
          python - <<'PY' >> .phase1/diagnostic.txt 2>&1
          import base64, gzip, hashlib, traceback
          from pathlib import Path
          names = [
              'patch-00.b64','patch-01.b64','patch-02.b64','patch-03a.b64',
              'patch-03b.b64','patch-03c.b64','patch-04a.b64','patch-05b.b64'
          ]
          try:
              encoded = ''.join((Path('.phase1') / name).read_text() for name in names)
              print('encoded_chars=', len(encoded))
              raw = base64.b64decode(encoded, validate=True)
              print('gzip_bytes=', len(raw), 'gzip_sha256=', hashlib.sha256(raw).hexdigest())
              patch = gzip.decompress(raw)
              print('patch_bytes=', len(patch), 'patch_sha256=', hashlib.sha256(patch).hexdigest())
              print('patch_head=', repr(patch[:100]))
              Path('/tmp/phase1.patch').write_bytes(patch)
          except Exception:
              traceback.print_exc()
              raise
          PY
          py_status=$?
          echo "python_status=$py_status" >> .phase1/diagnostic.txt
          if [ "$py_status" -eq 0 ]; then
            git apply --check /tmp/phase1.patch >> .phase1/diagnostic.txt 2>&1
            check_status=$?
          else
            check_status=99
          fi
          echo "git_apply_check_status=$check_status" >> .phase1/diagnostic.txt
          git config user.name 'Phase 1 Research Builder'
          git config user.email 'phase1-research-builder@users.noreply.github.com'
          if [ "$check_status" -ne 0 ]; then
            git add .phase1/diagnostic.txt
            git commit -m 'Record Phase 1 patch diagnostic'
            git push origin HEAD:phase1-full-history-v2.5.0
            exit 1
          fi
          git apply /tmp/phase1.patch
          apply_status=$?
          echo "git_apply_status=$apply_status" >> .phase1/diagnostic.txt
          if [ "$apply_status" -ne 0 ]; then
            git add .phase1/diagnostic.txt
            git commit -m 'Record Phase 1 patch diagnostic'
            git push origin HEAD:phase1-full-history-v2.5.0
            exit 1
          fi
          rm -rf .phase1
          rm -f .github/workflows/apply-phase1.yml
          git add -A
          git commit -m 'Implement Phase 1 full-history clustered discovery infrastructure'
          git push origin HEAD:phase1-full-history-v2.5.0
