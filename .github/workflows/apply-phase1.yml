name: apply-phase1

on:
  push:
    branches:
      - phase1-full-history-v2.5.0
    paths:
      - '.github/workflows/apply-phase1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-full-history-v2.5.0
          fetch-depth: 0
      - name: Apply fresh-schema compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/db.py')
          s = p.read_text()
          old = "conrelid='public.ra_jobs'::regclass"
          new = "conrelid=to_regclass('public.ra_jobs')"
          if old not in s:
              raise SystemExit('expected fresh-schema probe pattern not found')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'Phase 1 Research Builder'
          git config user.email 'phase1-research-builder@users.noreply.github.com'
          git add app/db.py
          git commit -m 'Harden fresh-schema compatibility probe'
          git push origin HEAD:phase1-full-history-v2.5.0
