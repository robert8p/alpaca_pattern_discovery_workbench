name: apply-phase1

on:
  push:
    branches:
      - phase1-full-history-v2.5.0
    paths:
      - '.github/workflows/apply-phase1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-full-history-v2.5.0
          fetch-depth: 0
      - name: Reassemble and apply audited Phase 1 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          names = [
              'patch-00.b64','patch-01.b64','patch-02.b64','patch-03a.b64',
              'patch-03b.b64','patch-03c.b64','patch-04a.b64','patch-05b.b64'
          ]
          encoded = ''.join((Path('.phase1') / name).read_text() for name in names)
          print('encoded_chars=', len(encoded))
          raw = base64.b64decode(encoded, validate=True)
          print('gzip_bytes=', len(raw))
          patch = gzip.decompress(raw)
          print('patch_bytes=', len(patch))
          Path('/tmp/phase1.patch').write_bytes(patch)
          PY
          git apply --check /tmp/phase1.patch
          git apply /tmp/phase1.patch
          rm -rf .phase1
          rm -f .github/workflows/apply-phase1.yml
          git config user.name 'Phase 1 Research Builder'
          git config user.email 'phase1-research-builder@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Phase 1 full-history clustered discovery infrastructure'
          git push origin HEAD:phase1-full-history-v2.5.0
