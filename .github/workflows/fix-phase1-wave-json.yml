name: fix-phase1-wave-json
on:
  push:
    branches: [phase1-full-history-v2.5.0]
    paths: ['.github/workflows/fix-phase1-wave-json.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-full-history-v2.5.0
      - name: Adapt candidate-wave concentration maps as JSONB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/candidate_waves.py')
          s=p.read_text()
          old='config.signal_strength_field or "not_defined", r.get("exchange_concentration"), r.get("largest_exchange_share_pct"),\n                                r.get("sector_concentration"), r.get("largest_sector_share_pct"), prev, change, pct_change,'
          new='config.signal_strength_field or "not_defined", Jsonb(r["exchange_concentration"]) if r.get("exchange_concentration") is not None else None, r.get("largest_exchange_share_pct"),\n                                Jsonb(r["sector_concentration"]) if r.get("sector_concentration") is not None else None, r.get("largest_sector_share_pct"), prev, change, pct_change,'
          if old not in s:
              raise SystemExit('expected candidate-wave concentration bindings not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Phase 1 Research Builder'
          git config user.email 'phase1-research-builder@users.noreply.github.com'
          git add app/candidate_waves.py
          git commit -m 'Adapt candidate-wave concentration maps as JSONB'
          git push origin HEAD:phase1-full-history-v2.5.0
