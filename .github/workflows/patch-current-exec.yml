name: patch-current-executable-strategy
on:
  push:
    branches: [executable-strategy-v27d]
    paths: ['.github/workflows/patch-current-exec.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: executable-strategy-v27d
      - run: |
          python scripts/patch_exec_current_tmp.py
          git checkout -- .github/workflows/ci.yml
          git config user.name 'Executable Strategy Research Builder'
          git config user.email 'executable-strategy@users.noreply.github.com'
          git add app/models.py app/executable_strategy.py app/db.py app/worker.py app/main.py app/templates/index.html scripts/release_audit.py tests/test_candidate_export.py tests/test_schema_startup.py
          git diff --cached --quiet || git commit -m 'Integrate executable strategy economics with complete-strategy freeze'
          git push origin HEAD:executable-strategy-v27d
